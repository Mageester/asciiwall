<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AsciiWall Host</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; user-select: none; }
  .vp { position: absolute; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; }
  .layer canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .bg { image-rendering: auto; }
  .vig, .dim { position: absolute; inset: 0; pointer-events: none; }
  .vig { background: radial-gradient(ellipse farthest-corner at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.36) 100%); }
  #dbg { position: fixed; left: 12px; bottom: 12px; font: 12px/1.4 Consolas, monospace; color: #fff; background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px; display: none; z-index: 9; }
</style>
</head>
<body>
<div id="dbg"></div>
<script src="engine.js"></script>
<script src="scenes-classic.js"></script>
<script src="scenes-more.js"></script>
<script src="user-scenes.js"></script>
<script src="wall.js"></script>
</body>
</html>
